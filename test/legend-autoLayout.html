  <script>
    require(['echarts'], function (echarts) {

      // 辅助函数：从控件状态中获取实际值
      function getValueFromControlState(controlState, controlDefine) {
        if (!controlState || typeof controlState.optionIndex !== 'number') {
          return controlDefine.value; // 返回默认值
        }
        var optionIndex = controlState.optionIndex;
        if (controlDefine.values) {
          return controlDefine.values[optionIndex];
        } else if (controlDefine.options) {
          return controlDefine.options[optionIndex].value;
        }
        return controlDefine.value; // 返回默认值
      }

      // 辅助函数：获取控件定义
      function getControlDefinition(paramName) {
        var controlDefinitions = {
          'enableAutoLayout': { values: [false, true], value: true },
          'position': { values: ['bottom', 'top', 'left', 'right'], value: 'bottom' },
          'align': { values: ['start', 'center', 'end'], value: 'center' },
          'layoutMode': { values: ['singleLine', 'multiLine'], value: 'multiLine' },
          'singleOrient': { values: ['horizontal', 'vertical'], value: 'horizontal' },
          'orient': { values: ['horizontal', 'vertical'], value: 'horizontal' },
          'horizontalAxisPosition': { values: ['top', 'bottom'], value: 'bottom' },
          'verticalAxisPosition': { values: ['left', 'right'], value: 'right' },
          'showAxisName': { values: [false, true], value: true }
        };
        return controlDefinitions[paramName] || null;
      }

      // 通用onchange处理函数
      function handleOptionChange(chart, optionGenerator, paramNames) {
        var state = chart.__testHelper.getInputsState();
        var params = [];

        // 处理参数映射
        for (var i = 0; i < paramNames.length; i++) {
          var paramName = paramNames[i];
          var controlState = state[paramName];

          if (controlState && controlState.value !== undefined) {
            // range控件：直接使用value
            params.push(controlState.value);
          } else if (controlState && controlState.optionIndex !== undefined) {
            // select控件：使用optionIndex获取值
            var controlDef = getControlDefinition(paramName);
            if (controlDef) {
              params.push(getValueFromControlState(controlState, controlDef));
            }
            else {
              // 默认情况
              params.push(controlState.optionIndex);
            }
          } else {
            // 默认值
            params.push(null);
          }
        }

        var opt = optionGenerator.apply(null, params);
        chart.setOption(opt, true);
      }

      var chart0Names = ['enableAutoLayout', 'position', 'align', 'showAxisName'];
      var chart1Names = ['enableAutoLayout', 'position', 'align', 'layoutMode', 'legend1Count', 'legend2Count'];
      var chart2Names = ['enableAutoLayout', 'position', 'align', 'layoutMode'];
      var chart17Names = ['enableAutoLayout', 'position', 'align'];
      var chart18Names = ['enableAutoLayout', 'position', 'align', 'layoutMode'];
      var chart19Names = ['enableAutoLayout', 'position', 'align', 'orient'];

      // 辅助函数：生成场景0的配置（单图例的自动布局测试）

      // 预定义的固定系列数据模板
      var barSeriesTemplates = [
        { name: '系列A', type: 'bar', data: [120, 200, 150, 80, 70, 110, 130] },
        { name: '系列B', type: 'bar', data: [60, 100, 75, 40, 35, 55, 65] },

        { name: '系列M', type: 'line', data: [25, 40, 30, 20, 15, 25, 27] },
        { name: '系列N', type: 'line', data: [35, 55, 45, 25, 20, 35, 40] },
        { name: '系列O', type: 'line', data: [15, 25, 20, 12, 10, 15, 17] },
        { name: '系列P', type: 'line', data: [60, 90, 75, 45, 35, 60, 70] }
      ];

      // 辅助函数：生成系列名称，支持无限循环（A, B, ..., Z, A-1, B-1, ..., Z-1, A-2, ...）
      function generateSeriesName(index) {
        var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        var letterIndex = index % 26;
        var cycleNumber = Math.floor(index / 26);
        var letter = letters[letterIndex];
        if (cycleNumber === 0) {
          return letter;
        } else {
          return letter + '-' + cycleNumber;
        }
      }

      // 辅助函数：生成场景1的配置（多图例的自动布局测试）
      function getOption1(enableAutoLayout, position, align, layoutMode, legend1Count, legend2Count) {
        // 选择系列数据：图例1的所有系列都是柱形图，图例2的所有系列都是折线图
        var selectedSeries = [];
        var legend1Data = [];
        var legend2Data = [];

        // 选择图例1的系列（柱形图）
        for (var i = 0; i < legend1Count; i++) {
          var templateIndex = i % barSeriesTemplates.length;
          var seriesName = '系列' + generateSeriesName(i);
          selectedSeries.push({
            name: seriesName,
            type: 'bar',
            data: barSeriesTemplates[templateIndex].data.slice() // 复制数据
          });
          legend1Data.push(seriesName);
        }

        // 选择图例2的系列（折线图）
        for (var i = 0; i < legend2Count; i++) {
          var templateIndex = i % lineSeriesTemplates.length;
          var seriesName = '系列' + generateSeriesName(legend1Count + i);
          selectedSeries.push({
            name: seriesName,
            type: 'line',
            data: lineSeriesTemplates[templateIndex].data.slice() // 复制数据
          });
          legend2Data.push(seriesName);
        }

        var option = {
          xAxis: {
            type: 'category',
            data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
          },
          yAxis: {
            type: 'value'
          },
          series: selectedSeries
        };

        if (enableAutoLayout) {
          var legends = [];
          if (legend1Data.length > 0) {
            legends.push({
              type: 'scroll',
              autoLayout: {
                enable: true,
                position: position,
                align: align,
                layoutMode: layoutMode
              },
              data: legend1Data,
              // 清除手动定位属性
              left: undefined,
              right: undefined,
              top: undefined,
              bottom: undefined
            });
          }
          if (legend2Data.length > 0) {
            legends.push({
              type: 'scroll',
              autoLayout: {
                enable: true,
                position: position,
                align: align,
                layoutMode: layoutMode
              },
              data: legend2Data,
              // 清除手动定位属性
              left: undefined,
              right: undefined,
              top: undefined,
              bottom: undefined
            });
          }
          option.legend = legends;
        } else {
          var legends = [];
          if (legend1Data.length > 0) {
            legends.push({
              data: legend1Data
            });
          }
          if (legend2Data.length > 0) {
            legends.push({
              data: legend2Data
            });
          }
          option.legend = legends;
        }

        return option;
      }

      }

      // 辅助函数：生成场景4的配置（双饼图的自动布局测试）
